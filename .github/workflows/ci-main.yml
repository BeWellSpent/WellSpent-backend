name: CI — Main

on:
  push:
    branches: [main]

env:
  RESOURCE_GROUP: wellspent-prod
  ACR_NAME: wellspentacr # must match infra/terraform/variables.tf's acr_name default
  IMAGE: wellspentacr.azurecr.io/wellspent-backend
  CONTAINER_APP: wellspent-csharp-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore WellSpent.slnx
      - name: Build
        run: dotnet build WellSpent.slnx --no-restore -c Release
      - name: Test
        run: dotnet test WellSpent.slnx --no-build -c Release

  # Config and secrets (FRONTEND_URL, APNS_*, DATABASE_URL, etc.) are already
  # wired into the Container App and both jobs by Terraform — Key Vault
  # references for secrets, plain values for everything else, resolved by
  # the shared managed identity at container-start. A deploy only ever needs
  # to bump the image tag; nothing env-related belongs in this workflow.
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write # required for OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Migrate prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          docker run --rm \
            -e DATABASE_URL \
            --entrypoint dotnet \
            ${{ env.IMAGE }}:${{ github.sha }} migrator/WellSpent.Migrator.dll up prod

      - name: Deploy API — Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}

      # Scheduling (cycle-budgets: 1st of each month; plaid-sync: Mon/Wed/Fri
      # 9am UTC) is baked into each Container Apps Job's own
      # schedule_trigger_config by Terraform — no separate Cloud
      # Scheduler-equivalent to manage from here.
      - name: Deploy cycle-budgets — Container Apps Job
        run: |
          az containerapp job update \
            --name cycle-budgets \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy plaid-sync — Container Apps Job
        run: |
          az containerapp job update \
            --name plaid-sync \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}
