name: CI — Main

on:
  push:
    branches: [main]

env:
  REGION: us-central1
  # Kept under its already-live service/image names (not renamed to
  # "wellspent-backend") — all clients already point at this URL, and
  # renaming a Cloud Run service means standing up a new one and migrating
  # traffic, not an in-place rename.
  SERVICE: wellspent-csharp-backend
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/wellspent/csharp-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore WellSpent.slnx
      - name: Build
        run: dotnet build WellSpent.slnx --no-restore -c Release
      - name: Test
        run: dotnet test WellSpent.slnx --no-build -c Release

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Decrypt prod config
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          SOPS_VERSION=3.9.4
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
          mkdir -p ~/.config/sops/age
          printf '%s\n' "${SOPS_AGE_KEY}" > ~/.config/sops/age/keys.txt
          sops --decrypt .env.prod.enc > .env.prod
          # Strip trailing CR from every line — a CRLF-terminated .env.prod
          # (e.g. re-encrypted from a Windows editor) leaves a stray \r stuck
          # to the end of each sourced value. That's invisible when checking
          # the value later (Cloud Run console, echo, etc.) but net/http
          # rejects it outright as an invalid HTTP header field value.
          sed -i 's/\r$//' .env.prod
          set -a; source .env.prod; set +a
          printf 'FRONTEND_URL=%s\n'           "${FRONTEND_URL}"           >> $GITHUB_ENV
          printf 'GOOGLE_REDIRECT_URI=%s\n'    "${GOOGLE_REDIRECT_URI}"    >> $GITHUB_ENV
          printf 'GOOGLE_CLIENT_ID=%s\n'       "${GOOGLE_CLIENT_ID}"       >> $GITHUB_ENV
          printf 'PLAID_CLIENT_ID=%s\n'        "${PLAID_CLIENT_ID}"        >> $GITHUB_ENV
          printf 'PLAID_WEBHOOK_URL=%s\n'      "${PLAID_WEBHOOK_URL}"      >> $GITHUB_ENV
          printf 'RESEND_FROM_EMAIL=%s\n'      "${RESEND_FROM_EMAIL}"      >> $GITHUB_ENV
          printf 'APNS_KEY_ID=%s\n'            "${APNS_KEY_ID}"            >> $GITHUB_ENV
          printf 'APNS_TEAM_ID=%s\n'           "${APNS_TEAM_ID}"           >> $GITHUB_ENV
          printf 'APNS_ENVIRONMENT=%s\n'       "${APNS_ENVIRONMENT}"       >> $GITHUB_ENV
          # deploy-cloudrun's env_vars parser strips single backslashes; double them so \n survives intact.
          APNS_AUTH_KEY_ESCAPED=$(printf '%s' "${APNS_AUTH_KEY}" | sed 's/\\/\\\\/g')
          printf 'APNS_AUTH_KEY=%s\n'          "${APNS_AUTH_KEY_ESCAPED}"  >> $GITHUB_ENV
          # Raw (non-double-escaped) form for the two `gcloud run jobs deploy`
          # steps below — those go straight through the gcloud CLI, not
          # deploy-cloudrun's own env_vars parser, so they need the literal
          # \n form AppConfig's NormalizePemKey expects.
          printf 'APNS_AUTH_KEY_RAW=%s\n'      "${APNS_AUTH_KEY}"          >> $GITHUB_ENV
          # Sign in with Apple. Deliberately plain env vars sourced from
          # .env.prod.enc rather than Secret Manager entries: the free tier
          # allows 6 active secrets and all 6 are already spoken for
          # (DATABASE_URL, JWT_SECRET, GOOGLE_CLIENT_SECRET, RESEND_API_KEY,
          # PLAID_SECRET, ENCRYPTION_KEY). APNS_AUTH_KEY — the other .p8 this
          # app holds — is handled exactly this way already.
          #
          # APPLE_CLIENT_ID/APPLE_TEAM_ID aren't forwarded: their config
          # defaults (com.bewellspent.WellSpent / 76FQ7V92H5) are correct, the
          # same way APNS_BUNDLE_ID relies on its own default.
          printf 'APPLE_KEY_ID=%s\n'           "${APPLE_KEY_ID}"           >> $GITHUB_ENV
          # Double-escaped for deploy-cloudrun's env_vars parser, same as APNS_AUTH_KEY above.
          APPLE_PRIVATE_KEY_ESCAPED=$(printf '%s' "${APPLE_PRIVATE_KEY}" | sed 's/\\/\\\\/g')
          printf 'APPLE_PRIVATE_KEY=%s\n'      "${APPLE_PRIVATE_KEY_ESCAPED}" >> $GITHUB_ENV
          printf 'MEDIATR_LICENSE_KEY=%s\n'    "${MEDIATR_LICENSE_KEY}"    >> $GITHUB_ENV
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev
      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
      - name: Migrate prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          docker run --rm \
            -e DATABASE_URL \
            --entrypoint dotnet \
            ${{ env.IMAGE }}:${{ github.sha }} migrator/WellSpent.Migrator.dll up prod
      - name: Deploy API — Cloud Run Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          # --cpu-boost: extra CPU allocated during container startup only,
          # then drops back to normal — free on Cloud Run, shortens the cold
          # start after scale-to-zero instead of adding cost (startup finishes
          # faster, so fewer total CPU-seconds billed for that window, not more).
          flags: --allow-unauthenticated --cpu-boost
          env_vars: |
            ENV=prod
            CORS_ALLOWED_ORIGINS=https://bewellspent.com
            PLAID_ENV=production
            FRONTEND_URL=${{ env.FRONTEND_URL }}
            GOOGLE_REDIRECT_URI=${{ env.GOOGLE_REDIRECT_URI }}
            GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
            PLAID_CLIENT_ID=${{ env.PLAID_CLIENT_ID }}
            PLAID_WEBHOOK_URL=${{ env.PLAID_WEBHOOK_URL }}
            RESEND_FROM_EMAIL=${{ env.RESEND_FROM_EMAIL }}
            APNS_KEY_ID=${{ env.APNS_KEY_ID }}
            APNS_TEAM_ID=${{ env.APNS_TEAM_ID }}
            APNS_ENVIRONMENT=${{ env.APNS_ENVIRONMENT }}
            APNS_AUTH_KEY=${{ env.APNS_AUTH_KEY }}
            APPLE_KEY_ID=${{ env.APPLE_KEY_ID }}
            APPLE_PRIVATE_KEY=${{ env.APPLE_PRIVATE_KEY }}
            MEDIATR_LICENSE_KEY=${{ env.MEDIATR_LICENSE_KEY }}
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            JWT_SECRET=JWT_SECRET:latest
            GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest
            RESEND_API_KEY=RESEND_API_KEY:latest
            PLAID_SECRET=PLAID_SECRET:latest
            ENCRYPTION_KEY=ENCRYPTION_KEY:latest

      # Both Cloud Run Jobs redeploy here too, same as the API above — this
      # was manual-only for a stretch during the C# rewrite (deploy-csharp.yml
      # only), which is how the jobs ended up running weeks-stale code while
      # the API kept auto-deploying. Restored to automatic so job code never
      # silently drifts from what's on main again. deploy-csharp.yml keeps
      # its own copy of these same two steps as a manual escape hatch (e.g.
      # re-running a job deploy without a new commit, or the one-off
      # `plaid-sync --backfill-webhooks` mode) — not the only path anymore.
      - name: Deploy cycle-budgets — Cloud Run Job
        run: |
          gcloud run jobs deploy cycle-budgets \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --command=./cycle-budgets/WellSpent.Jobs.CycleBudgets \
            --set-env-vars="ENV=prod,FRONTEND_URL=${{ env.FRONTEND_URL }},RESEND_FROM_EMAIL=${{ env.RESEND_FROM_EMAIL }},PLAID_ENV=production,PLAID_CLIENT_ID=${{ env.PLAID_CLIENT_ID }},APNS_KEY_ID=${{ env.APNS_KEY_ID }},APNS_TEAM_ID=${{ env.APNS_TEAM_ID }},APNS_ENVIRONMENT=${{ env.APNS_ENVIRONMENT }},APNS_AUTH_KEY=${{ env.APNS_AUTH_KEY_RAW }},MEDIATR_LICENSE_KEY=${{ env.MEDIATR_LICENSE_KEY }}" \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,PLAID_SECRET=PLAID_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest \
            --max-retries=1 \
            --project=${{ secrets.GCP_PROJECT_ID }}

      # plaid-sync's own Mon/Wed/Fri trigger was removed deliberately — sync
      # is now webhook-driven (POST /webhooks/plaid), not polled. The job
      # itself still redeploys here so `--backfill-webhooks` and any ad-hoc
      # manual full resync always run current code.
      - name: Deploy plaid-sync — Cloud Run Job
        run: |
          gcloud run jobs deploy plaid-sync \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --command=./plaid-sync/WellSpent.Jobs.PlaidSync \
            --set-env-vars="ENV=prod,PLAID_ENV=production,PLAID_CLIENT_ID=${{ env.PLAID_CLIENT_ID }},PLAID_WEBHOOK_URL=${{ env.PLAID_WEBHOOK_URL }},RESEND_FROM_EMAIL=${{ env.RESEND_FROM_EMAIL }},APNS_KEY_ID=${{ env.APNS_KEY_ID }},APNS_TEAM_ID=${{ env.APNS_TEAM_ID }},APNS_ENVIRONMENT=${{ env.APNS_ENVIRONMENT }},APNS_AUTH_KEY=${{ env.APNS_AUTH_KEY_RAW }},MEDIATR_LICENSE_KEY=${{ env.MEDIATR_LICENSE_KEY }}" \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,PLAID_SECRET=PLAID_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,RESEND_API_KEY=RESEND_API_KEY:latest \
            --max-retries=1 \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Schedule cycle-budgets — 1st of each month
        run: |
          SA=$(gcloud config get-value account)
          URI="https://${{ env.REGION }}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${{ secrets.GCP_PROJECT_ID }}/jobs/cycle-budgets:run"
          ARGS=(
            http cycle-budgets-trigger
            --location=${{ env.REGION }}
            --schedule="0 0 1 * *"
            --uri="$URI"
            --message-body=""
            --oauth-service-account-email="$SA"
            --project=${{ secrets.GCP_PROJECT_ID }}
          )
          gcloud scheduler jobs update "${ARGS[@]}" 2>/dev/null \
            || gcloud scheduler jobs create "${ARGS[@]}"
