name: CI — C# rewrite

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Build + test only. This repo is now C#-only — the Go backend was fully
# decommissioned and rewrite/csharp (its old dotnet/-nested layout) is dead;
# this is the required status check (context "Build & Test") gating the
# develop -> main PR. Deploying is separate: ci-main.yml's own `deploy` job
# ships the API automatically on push to main, and deploy-csharp.yml is the
# manual job-only/escape-hatch path — this workflow never deploys.

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore WellSpent.slnx
      - name: Build
        run: dotnet build WellSpent.slnx --no-restore -c Release
      - name: Test
        run: dotnet test WellSpent.slnx --no-build -c Release
