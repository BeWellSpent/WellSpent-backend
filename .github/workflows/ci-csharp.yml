name: CI — C# rewrite

on:
  push:
    branches: [develop, rewrite/csharp]
  pull_request:
    branches: [develop, rewrite/csharp]

# Build + test only. dotnet/ now lives on develop/main (merged from
# rewrite/csharp); that branch is kept here only in case it's still used for
# in-progress C#-only work. Deploying is separate: ci-main.yml's own `deploy`
# job ships the API automatically on push to main, and deploy-csharp.yml is
# the manual job-only/escape-hatch path — this workflow never deploys.

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore dotnet/WellSpent.slnx
      - name: Build
        run: dotnet build dotnet/WellSpent.slnx --no-restore -c Release
      - name: Test
        run: dotnet test dotnet/WellSpent.slnx --no-build -c Release
