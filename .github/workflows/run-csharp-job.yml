name: Run a C# Container Apps Job on demand

# Manual, one-shot execution of an already-deployed Container Apps Job
# (cycle-budgets or plaid-sync) — for confirming a job actually runs
# correctly after a redeploy, without waiting for its natural cron trigger.
# Does not deploy or change anything; the job runs exactly as it would on
# its real schedule, against the real prod database.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        type: choice
        options: [cycle-budgets, plaid-sync]

permissions:
  id-token: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Execute job
        run: az containerapp job start --name ${{ inputs.job }} --resource-group wellspent-prod
