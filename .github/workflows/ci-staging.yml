name: CI — Staging

on:
  push:
    branches: [develop]

env:
  REGION: us-central1
  SERVICE: wellspent-backend-staging
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/wellspent/backend

jobs:
  generate:
    name: Generate proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/buf-auth
        with:
          buf_token: ${{ secrets.BUF_TOKEN }}
      - name: Generate
        run: buf generate
      - uses: actions/upload-artifact@v4
        with:
          name: gen
          path: gen/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: gen
          path: gen/
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  deploy:
    name: Deploy to Cloud Run (staging)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: gen
          path: gen/
      # No GCP Secret Manager for staging — every runtime value (including
      # DATABASE_URL/JWT_SECRET/etc.) is sourced straight from .env.staging.enc
      # and passed to Cloud Run as plain env vars below.
      - name: Decrypt staging config
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          SOPS_VERSION=3.9.4
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
          mkdir -p ~/.config/sops/age
          printf '%s\n' "${SOPS_AGE_KEY}" > ~/.config/sops/age/keys.txt
          sops --decrypt .env.staging.enc > .env.staging
          # Strip trailing CR — see ci-main.yml for why (CRLF breaks net/http header parsing)
          sed -i 's/\r$//' .env.staging
          set -a; source .env.staging; set +a
          printf 'DATABASE_URL=%s\n'           "${DATABASE_URL}"           >> $GITHUB_ENV
          printf 'JWT_SECRET=%s\n'             "${JWT_SECRET}"             >> $GITHUB_ENV
          printf 'GOOGLE_CLIENT_ID=%s\n'       "${GOOGLE_CLIENT_ID}"       >> $GITHUB_ENV
          printf 'GOOGLE_CLIENT_SECRET=%s\n'   "${GOOGLE_CLIENT_SECRET}"   >> $GITHUB_ENV
          printf 'GOOGLE_REDIRECT_URI=%s\n'    "${GOOGLE_REDIRECT_URI}"    >> $GITHUB_ENV
          printf 'PLAID_CLIENT_ID=%s\n'        "${PLAID_CLIENT_ID}"        >> $GITHUB_ENV
          printf 'PLAID_SECRET=%s\n'           "${PLAID_SECRET}"           >> $GITHUB_ENV
          printf 'RESEND_API_KEY=%s\n'         "${RESEND_API_KEY}"         >> $GITHUB_ENV
          printf 'ENCRYPTION_KEY=%s\n'         "${ENCRYPTION_KEY}"         >> $GITHUB_ENV
          printf 'FRONTEND_URL=%s\n'           "${FRONTEND_URL}"           >> $GITHUB_ENV
          printf 'CORS_ALLOWED_ORIGINS=%s\n'   "${CORS_ALLOWED_ORIGINS}"   >> $GITHUB_ENV
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev
      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
      - name: Migrate staging DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: go run ./cmd/migrate up
      - name: Deploy API — Cloud Run Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: --allow-unauthenticated
          env_vars: |
            ENV=staging
            DEBUG=false
            PLAID_ENV=sandbox
            DATABASE_URL=${{ env.DATABASE_URL }}
            JWT_SECRET=${{ env.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ env.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ env.GOOGLE_REDIRECT_URI }}
            PLAID_CLIENT_ID=${{ env.PLAID_CLIENT_ID }}
            PLAID_SECRET=${{ env.PLAID_SECRET }}
            RESEND_API_KEY=${{ env.RESEND_API_KEY }}
            ENCRYPTION_KEY=${{ env.ENCRYPTION_KEY }}
            FRONTEND_URL=${{ env.FRONTEND_URL }}
            CORS_ALLOWED_ORIGINS=${{ env.CORS_ALLOWED_ORIGINS }}
