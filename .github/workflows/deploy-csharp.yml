name: Deploy C# backend to Azure (manual)

# ci-main.yml redeploys automatically on every push to main. This is the
# manual escape hatch for re-running that same deploy without a new push
# (e.g. after a Terraform/Key Vault change with no code change) — run from
# the Actions tab or `gh workflow run deploy-csharp.yml`.

on:
  workflow_dispatch:

env:
  RESOURCE_GROUP: wellspent-prod
  ACR_NAME: wellspentacr # must match infra/terraform/variables.tf's acr_name default
  IMAGE: wellspentacr.azurecr.io/wellspent-backend
  CONTAINER_APP: wellspent-csharp-backend

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore WellSpent.slnx
      - name: Build
        run: dotnet build WellSpent.slnx --no-restore -c Release
      - name: Test
        run: dotnet test WellSpent.slnx --no-build -c Release

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Migrate prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          docker run --rm \
            -e DATABASE_URL \
            --entrypoint dotnet \
            ${{ env.IMAGE }}:${{ github.sha }} migrator/WellSpent.Migrator.dll up prod

      - name: Deploy API — Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy cycle-budgets — Container Apps Job
        run: |
          az containerapp job update \
            --name cycle-budgets \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy plaid-sync — Container Apps Job
        run: |
          az containerapp job update \
            --name plaid-sync \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}
