name: CI — Develop

on:
  push:
    branches: [develop]

# Verification only. This is what gates the develop -> main PR that `gh pr merge
# --auto` waits on, so it must keep running even though nothing deploys from
# develop any more (the staging environment was removed 2026-08-25).

jobs:
  generate:
    # This name is a required status check in the repo ruleset, not just a
    # label — renaming it silently stops the gate reporting and leaves PRs
    # waiting forever on a check that no longer exists. Change the ruleset
    # first if it ever needs a new name.
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/buf-auth
        with:
          buf_token: ${{ secrets.BUF_TOKEN }}
      # Go is needed for the REST codegen below (`go tool oapi-codegen`), which
      # is pinned by go.mod's tool directive.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate proto
        run: buf generate
      # The OpenAPI contract lives in WellSpent-proto but does not go through
      # BSR — there is no OpenAPI equivalent. That repo is public, so this
      # fetches the raw file. Output lands in gen/rest/, so the existing
      # artifact upload below carries it with no extra plumbing.
      - name: Generate REST
        run: make generate-rest
      - uses: actions/upload-artifact@v4
        with:
          name: gen
          path: gen/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: gen
          path: gen/
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
